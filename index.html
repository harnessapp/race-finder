<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trotify Race Finder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Trotify Race Finder</h1>
      <p>Find upcoming races a horse may be eligible for.</p>
    </header>

    <section class="card trainer-card">
      <h2>Trainer Settings</h2>

      <div class="grid trainer-grid">
        <label>Trainer Postcode <input id="trainerPostcode" /></label>
        <label>Max Travel KM
          <select id="maxTravelKm">
            <option value="">Any</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="150">150</option>
            <option value="200">200</option>
            <option value="250">250</option>
            <option value="300">300</option>
            <option value="350">350</option>
            <option value="400">400</option>
            <option value="450">450</option>
            <option value="500">500</option>
            <option value="600">600</option>
            <option value="1000">1000</option>
          </select>
        </label>

        <label>Sort By
          <select id="sortBy">
            <option value="fit">Fit</option>
            <option value="date">Date</option>
          </select>
        </label>

        <label class="checkbox">
          <input id="nextTwoWeeks" type="checkbox" />
          Next 2 weeks
        </label>
      </div>
    </section>

    <section class="card horse-list-card">
      <h2>Saved Horses</h2>

      <div class="horse-list-row">
        <select id="horseSelector"></select>
        <button id="addHorseBtn" type="button">+ Add Horse</button>
        <button id="saveHorseBtn" type="button">Save Horse</button>
      </div>
    </section>

          </select>
        </label>

        <label>Avoid Seasoned Winners
          <select id="avoidSeasonedWinners">
            <option value="off">Low</option>
            <option value="medium">Medium</option>
            <option value="strong">High</option>
          </select>
        </label>

        <label>Date From <input id="dateFrom" type="date" /></label>
        <label>Date To <input id="dateTo" type="date" /></label>

        <label>Sort By
          <select id="sortBy">
            <option value="fit">Fit</option>
            <option value="date">Date</option>
          </select>
        </label>

        <label class="checkbox">
          <input id="nextTwoWeeks" type="checkbox" />

        <label class="checkbox">
          <input id="vicbred" type="checkbox" />

        <label class="checkbox">
          <input id="avoidMetro" type="checkbox" />
          Avoid Metro

      </div>

      <button id="findBtn">Find Races</button>
      <button id="clearBtn" class="secondary">Clear Saved Details</button>
    </section>

    <section class="summary" id="summary"></section>

    <section id="results" class="results"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
